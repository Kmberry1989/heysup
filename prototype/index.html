<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>hey, sup? — prototype v4</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#0b0b12;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    touch-action:none; -webkit-user-select:none; user-select:none; }
  #game { position:fixed; inset:0; display:block; }
  #hud { position:fixed; top:10px; left:12px; color:#fff; z-index:5;
    text-shadow:0 2px 0 #000,-1px 0 0 #000,1px 0 0 #000,0 -1px 0 #000; }
  #hud .title { font-weight:800; font-size:18px; letter-spacing:.5px; }
  #hud .hint { font-size:12px; opacity:.85; margin-top:2px; }
  .hudbtn { position:fixed; z-index:5; width:56px; height:56px; border-radius:50%;
    border:3px solid #fff; font-size:26px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.5); }
  .hudbtn:active { transform:scale(.93); }
  #phoneBtn { right:14px; bottom:16px; background:#7c5cff; }
  #swapBtn { right:14px; bottom:84px; background:#ff9f1c; }
  #doorPrompt { position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    z-index:5; display:none; background:rgba(10,10,20,.82); color:#fff;
    border:2px solid #ffd23f; border-radius:999px; padding:10px 22px;
    font-size:15px; font-weight:700; cursor:pointer; white-space:nowrap; }
  #doorPrompt.show { display:block; }
  /* onscreen touch controller (touch devices only) */
  #dpad { position:fixed; left:12px; bottom:16px; z-index:7; display:none;
    grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); gap:4px; }
  body.touch #dpad { display:grid; }
  body.touch #dpad.hidden { display:none; }
  #dpad button { border-radius:50%; border:2px solid rgba(255,255,255,.7);
    background:rgba(10,10,20,.45); color:#fff; font-size:22px; touch-action:none; }
  #dpad button.pressed { background:rgba(124,92,255,.8); }
  #dpad .up { grid-column:2; grid-row:1; }
  #dpad .left { grid-column:1; grid-row:2; }
  #dpad .down { grid-column:2; grid-row:3; }
  #dpad .right { grid-column:3; grid-row:2; }
  body.touch #squirmy { bottom:196px; }
  #dpadToggle { right:14px; bottom:152px; background:#2ec4b6; display:none; }
  body.touch #dpadToggle { display:flex; }
  /* squirmy helper */
  #squirmy { position:fixed; left:12px; bottom:16px; z-index:6; display:none;
    align-items:flex-end; gap:8px; cursor:pointer; max-width:78vw; }
  #squirmy.show { display:flex; }
  #squirmy img { width:76px; height:76px; object-fit:cover; object-position:100% 0;
    border-radius:50%; border:3px solid #7CFC00; background:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.5); flex-shrink:0; }
  #sqBubble { background:#fff; border:3px solid #1c1c28; border-radius:14px;
    padding:8px 12px; font-size:13px; font-weight:600; color:#1c1c28;
    box-shadow:0 4px 14px rgba(0,0,0,.4); }
  /* intro cinematic */
  #introLayer { position:fixed; inset:0; z-index:30; display:none; }
  #introLayer.show { display:block; }
  #caption { position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    z-index:31; display:none; max-width:min(560px,90vw);
    background:rgba(5,5,12,.84); color:#fff; border:2px solid #ffd23f;
    border-radius:14px; padding:12px 18px; font-size:15px; line-height:1.45;
    text-align:center; }
  #caption.show { display:block; }
  #caption .who { color:#ffd23f; font-weight:800; }
  #skipIntro { position:fixed; top:12px; right:12px; z-index:32; display:none;
    background:rgba(10,10,20,.7); color:#fff; border:2px solid #fff;
    border-radius:999px; padding:8px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  #skipIntro.show { display:block; }
  #introBtn { right:14px; bottom:220px; background:#b565d8; }
  body.intro #hud, body.intro .hudbtn, body.intro #dpad,
  body.intro #doorPrompt, body.intro #squirmy { display:none !important; }
  /* phone */
  #phoneOverlay { position:fixed; inset:0; z-index:10; display:none;
    align-items:center; justify-content:center; background:rgba(5,5,12,.72); }
  #phoneOverlay.open { display:flex; }
  #phone { width:min(330px,86vw); aspect-ratio:9/16.2; background:#1c1c28;
    border-radius:34px; border:6px solid #8e7cc3; overflow:hidden; position:relative;
    box-shadow:0 12px 60px rgba(0,0,0,.7); }
  #phone .notch { position:absolute; top:10px; left:50%; transform:translateX(-50%);
    width:110px; height:22px; background:#1c1c28; border-radius:12px; z-index:3; }
  .pscreen { position:absolute; inset:0; padding:44px 14px 14px; display:none;
    flex-direction:column; background:linear-gradient(#fdf6ec,#f3e4f7); }
  .pscreen.open { display:flex; }
  .appgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:8px; }
  .app { background:#fff; border-radius:16px; padding:10px 4px; text-align:center;
    font-size:11px; font-weight:600; color:#333; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .app .ico { font-size:28px; display:block; margin-bottom:4px; }
  .app:active { transform:scale(.94); }
  .phead { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .phead .back { font-size:20px; cursor:pointer; background:#fff; border-radius:50%;
    width:34px; height:34px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.12); }
  .phead .ptitle { font-weight:800; font-size:16px; }
  #purrbyImg { width:150px; height:150px; object-fit:contain; align-self:center; margin:4px 0; }
  .bar { margin:6px 0; font-size:12px; font-weight:700; color:#555; }
  .bar .track { height:12px; background:#e5d9f2; border-radius:8px; margin-top:3px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:8px; transition:width .3s; }
  #mood { text-align:center; font-weight:800; font-size:15px; margin:8px 0; color:#7b2d8b; }
  .petbtns { display:flex; gap:10px; justify-content:center; margin-top:4px; }
  .petbtns button { font-size:15px; font-weight:700; border:none; border-radius:999px;
    padding:10px 20px; cursor:pointer; color:#fff; }
  #feedBtn { background:#ff6b6b; } #playBtn { background:#4ecdc4; }
  .petbtns button:active { transform:scale(.94); }
  #bamImg { width:100%; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  /* weedsweeper */
  #weedStatus { text-align:center; font-weight:800; font-size:14px; margin:2px 0 8px; color:#2d6a4f; min-height:20px; }
  #weedGrid { display:grid; grid-template-columns:repeat(8,1fr); gap:3px; align-self:center; }
  .wcell { width:32px; height:32px; background:#b7e4a8; border-radius:6px;
    display:flex; align-items:center; justify-content:center; font-size:16px;
    font-weight:800; color:#2d6a4f; cursor:pointer; }
  .wcell.open { background:#f4f1de; cursor:default; }
  .wcell.weed { background:#ffd6d6; }
  .weedbtns { display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .weedbtns button { font-size:13px; font-weight:700; border:none; border-radius:999px;
    padding:8px 14px; cursor:pointer; background:#2d6a4f; color:#fff; }
  .weedbtns button.active { background:#d68c45; }
  #toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    background:rgba(10,10,20,.9); color:#fff; padding:8px 18px; border-radius:999px;
    font-size:13px; z-index:20; display:none; }
  #toast.show { display:block; }
  #closeHint { position:fixed; bottom:18px; left:0; right:0; text-align:center;
    color:#fff; font-size:13px; z-index:11; display:none; text-shadow:0 2px 0 #000; }
  #closeHint.open { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="title">hey, sup?</div>
  <div class="hint">prototype v4 &middot; &larr;&rarr;/AD walk &middot; &uarr; enter &middot; tap phone</div>
</div>
<button id="swapBtn" class="hudbtn" aria-label="Swap character">🔄</button>
<button id="phoneBtn" class="hudbtn" aria-label="Open phone">📱</button>
<button id="dpadToggle" class="hudbtn" aria-label="Toggle touch controller">🎮</button>
<div id="dpad">
  <button class="up" data-k="ArrowUp" aria-label="Up">▲</button>
  <button class="left" data-k="ArrowLeft" aria-label="Left">◀</button>
  <button class="down" data-k="ArrowDown" aria-label="Down">▼</button>
  <button class="right" data-k="ArrowRight" aria-label="Right">▶</button>
</div>
<div id="doorPrompt"></div>
<div id="squirmy"><img src="assets/squirmy.webp" alt="Squirmy"><div id="sqBubble"></div></div>
<button id="introBtn" class="hudbtn" aria-label="Replay intro">🎬</button>
<div id="introLayer"></div>
<div id="caption"></div>
<button id="skipIntro">Skip ››</button>
<div id="phoneOverlay">
  <div id="phone">
    <div class="notch"></div>
    <div id="pHome" class="pscreen open">
      <div class="appgrid" id="appGrid"></div>
    </div>
    <div id="pTama" class="pscreen">
      <div class="phead"><div class="back" data-back>‹</div><div class="ptitle">TamaGotcha</div></div>
      <img id="purrbyImg" src="assets/purrby.webp" alt="Purrby">
      <div id="mood">thriving ✨</div>
      <div class="bar">Hunger<div class="track"><div class="fill" id="hungerFill" style="width:80%;background:#ff6b6b"></div></div></div>
      <div class="bar">Happiness<div class="track"><div class="fill" id="happyFill" style="width:80%;background:#4ecdc4"></div></div></div>
      <div class="petbtns">
        <button id="feedBtn">🍔 Feed</button>
        <button id="playBtn">🎾 Play</button>
      </div>
    </div>
    <div id="pBam" class="pscreen">
      <div class="phead"><div class="back" data-back>‹</div><div class="ptitle">BAM</div></div>
      <img id="bamImg" src="assets/bam.webp" alt="BAM conversation">
    </div>
    <div id="pWeed" class="pscreen">
      <div class="phead"><div class="back" data-back>‹</div><div class="ptitle">WEEDSWEEPER</div></div>
      <div id="weedStatus">find the weeds, don't pick 'em 🌿</div>
      <div id="weedGrid"></div>
      <div class="weedbtns">
        <button id="weedNew">🔄 New</button>
        <button id="weedFlag">🚩 Flag: off</button>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="closeHint">tap outside the phone to close</div>
<script>
"use strict";
// Sprite metadata extracted from the transparent keyed sheets (programmatic band scan)
const SHEETS = {
  him: {
    idle: [{"x":230,"y":11,"w":124,"h":238},{"x":494,"y":11,"w":125,"h":238},{"x":763,"y":11,"w":124,"h":238},{"x":1033,"y":11,"w":125,"h":238},{"x":1299,"y":11,"w":125,"h":238},{"x":1566,"y":11,"w":124,"h":238}],
    walk: [{"x":89,"y":264,"w":102,"h":182},{"x":320,"y":264,"w":102,"h":180},{"x":562,"y":264,"w":94,"h":182},{"x":789,"y":264,"w":101,"h":181},{"x":1024,"y":265,"w":102,"h":180},{"x":1258,"y":264,"w":104,"h":181},{"x":1488,"y":264,"w":106,"h":180},{"x":1730,"y":265,"w":100,"h":181}]
  },
  her: {
    idle: [{"x":432,"y":14,"w":138,"h":239},{"x":745,"y":14,"w":138,"h":239},{"x":1058,"y":14,"w":138,"h":239},{"x":1357,"y":14,"w":139,"h":239}],
    walk: [{"x":100,"y":291,"w":145,"h":237},{"x":356,"y":291,"w":136,"h":235},{"x":623,"y":291,"w":138,"h":238},{"x":890,"y":291,"w":127,"h":238},{"x":1148,"y":291,"w":138,"h":237},{"x":1404,"y":291,"w":148,"h":239},{"x":1667,"y":291,"w":151,"h":239}]
  }
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const streetImg = new Image(); streetImg.src = 'assets/street.webp';
const arcadeImg = new Image(); arcadeImg.src = 'assets/arcade.webp';
const mallImg = new Image(); mallImg.src = 'assets/mall.webp';
const himImg = new Image(); himImg.src = 'assets/him.png';
const herImg = new Image(); herImg.src = 'assets/her.png';
SHEETS.him.img = himImg; SHEETS.her.img = herImg;
const SCENE_IMG = { street: streetImg, arcade: arcadeImg, mall: mallImg };
const SCENE_BG = { street: '#7ec8f7', arcade: '#2a1a3e', mall: '#3e2a1a' };

const player = { x: 400, dir: 1, moving: false, animT: 0, heightPx: 200 };
let char = 'him';
let scene = 'street';
let enteredFrom = null; // which street door we used
const SPEED = 300;
const keys = {};
let touchLeft = false, touchRight = false;

window.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if (e.key === 'ArrowUp') tryEnter();
  if (e.key === 'ArrowDown') tryExit();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

const activeTouches = new Map();
function touchDir(t) { return t.clientX < W / 2 ? 'left' : 'right'; }
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) activeTouches.set(t.identifier, touchDir(t));
  updateTouch();
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) activeTouches.set(t.identifier, touchDir(t));
  updateTouch();
}, {passive:false});
function touchEnd(e) {
  for (const t of e.changedTouches) activeTouches.delete(t.identifier);
  updateTouch();
}
canvas.addEventListener('touchend', touchEnd);
canvas.addEventListener('touchcancel', touchEnd);
function updateTouch() {
  touchLeft = touchRight = false;
  for (const d of activeTouches.values()) d === 'left' ? touchLeft = true : touchRight = true;
}
let mouseDown = false, mouseDir = null;
canvas.addEventListener('mousedown', e => { mouseDown = true; mouseDir = touchDir(e); });
window.addEventListener('mouseup', () => { mouseDown = false; mouseDir = null; });
window.addEventListener('mousemove', e => { if (mouseDown) mouseDir = touchDir(e); });

// onscreen touch controller (shows on touch devices)
if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) {
  document.body.classList.add('touch');
}
const dpad = document.getElementById('dpad');
dpad.querySelectorAll('button').forEach(btn => {
  const k = btn.dataset.k;
  const press = e => {
    e.preventDefault();
    keys[k] = true;
    btn.classList.add('pressed');
    if (k === 'ArrowUp') tryEnter();
    if (k === 'ArrowDown') tryExit();
  };
  const release = e => {
    if (e) e.preventDefault();
    keys[k] = false;
    btn.classList.remove('pressed');
  };
  btn.addEventListener('touchstart', press, {passive:false});
  btn.addEventListener('touchend', release, {passive:false});
  btn.addEventListener('touchcancel', release, {passive:false});
  btn.addEventListener('mousedown', press);
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', () => release(null));
});
document.getElementById('dpadToggle').addEventListener('click', () => {
  dpad.classList.toggle('hidden');
});

// scenes + doors
function bgAspect(img) {
  return (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 16/9;
}
function worldW() {
  return Math.max(W, H * bgAspect(SCENE_IMG[scene]));
}
const DOORS = { arcade: [0.60, 0.70], mall: [0.80, 0.90] };
const doorPrompt = document.getElementById('doorPrompt');
function doorAt() {
  const w = worldW(), zx = player.x / w;
  for (const k of Object.keys(DOORS)) {
    if (zx >= DOORS[k][0] && zx <= DOORS[k][1]) return k;
  }
  return null;
}
function tryEnter() {
  if (scene !== 'street') return;
  const d = doorAt();
  if (d) {
    enteredFrom = d; scene = d; player.x = worldW() * 0.5; player.animT = 0;
    if (d === 'arcade') squirmyTip('arcade', 'The arcade! Mullet Kart grudge matches go down here. Check the Events app on your phone!');
    if (d === 'mall') squirmyTip('mall', 'The food court! Best chilli dogs in the bizarro 90s. Probably.');
  }
}
function tryExit() {
  if (scene === 'street' || !enteredFrom) return;
  const d = enteredFrom;
  scene = 'street'; enteredFrom = null;
  player.x = worldW() * ((DOORS[d][0] + DOORS[d][1]) / 2); player.animT = 0;
}
doorPrompt.addEventListener('click', () => { scene === 'street' ? tryEnter() : tryExit(); });

// squirmy helper
const squirmyEl = document.getElementById('squirmy');
const sqBubble = document.getElementById('sqBubble');
const seenTips = new Set();
let sqTimer = null;
function squirmyTip(key, text) {
  if (seenTips.has(key)) return;
  seenTips.add(key);
  sqBubble.textContent = text;
  squirmyEl.classList.add('show');
  clearTimeout(sqTimer);
  sqTimer = setTimeout(() => squirmyEl.classList.remove('show'), 7000);
}
squirmyEl.addEventListener('click', () => {
  squirmyEl.classList.remove('show');
  clearTimeout(sqTimer);
});

// ---- intro cinematic ----
const introLayer = document.getElementById('introLayer');
const captionEl = document.getElementById('caption');
const skipBtn = document.getElementById('skipIntro');
const standImg = new Image(); standImg.src = 'assets/stand.webp';
let mode = 'play';
const WX = 0.63, WY = 0.46; // serving-window center, fraction of screen
const INTRO = { beat: 0, t: 0, portalR: 0, flash: 0, spin: 0, suckT: 0, kyleT: 0 };
const BEATS = [
  { dur: 3.6, cap: "Kokomo. Friday night. They just cranked open the back bathroom window for business." },
  { dur: 3.4, cap: "<span class='who'>Rochelle:</span> &ldquo;Chilli dogs are on. Lights on. We&rsquo;re OPEN.&rdquo;" },
  { dur: 3.6, cap: "The OPEN sign flickers&hellip; and something tears open inside the window." },
  { dur: 3.2, cap: "<span class='who'>Kyle:</span> &ldquo;ROCHELLE!!&rdquo;" },
  { dur: 3.6, cap: "Kyle doesn&rsquo;t think. He dives." },
  { dur: 2.8, cap: "Somewhere&hellip; stuck in the 90s." }
];
function drawCover(img) {
  const s = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
}
function drawSheetFrame(img, f, cx, feetY, s, rot) {
  const dw = f.w * s, dh = f.h * s;
  ctx.save();
  ctx.translate(cx, feetY);
  ctx.rotate(rot || 0);
  if (img.naturalWidth) ctx.drawImage(img, f.x, f.y, f.w, f.h, -dw / 2, -dh, dw, dh);
  ctx.restore();
}
function startIntro() {
  INTRO.beat = 0; INTRO.t = 0; INTRO.portalR = 0; INTRO.flash = 0;
  INTRO.spin = 0; INTRO.suckT = 0; INTRO.kyleT = 0;
  mode = 'intro';
  document.body.classList.add('intro');
  introLayer.classList.add('show');
  captionEl.classList.add('show');
  skipBtn.classList.add('show');
  captionEl.innerHTML = BEATS[0].cap;
}
function finishIntro() {
  mode = 'play';
  document.body.classList.remove('intro');
  introLayer.classList.remove('show');
  captionEl.classList.remove('show');
  skipBtn.classList.remove('show');
  try { localStorage.setItem('heysup_intro', '1'); } catch (e) {}
  toast('Find each other. \u{1F32A}\uFE0F');
}
function nextBeat() {
  INTRO.beat++;
  INTRO.t = 0;
  if (INTRO.beat >= BEATS.length) { finishIntro(); return; }
  captionEl.innerHTML = BEATS[INTRO.beat].cap;
}
function drawIntro(dt) {
  INTRO.t += dt;
  INTRO.spin += dt * 4;
  const b = INTRO.beat, bt = INTRO.t;
  if (bt >= BEATS[b].dur) { nextBeat(); return; }

  if (standImg.naturalWidth) drawCover(standImg);
  else { ctx.fillStyle = '#0b0b18'; ctx.fillRect(0, 0, W, H); }
  if (b === 0) { ctx.fillStyle = 'rgba(2,2,16,0.55)'; ctx.fillRect(0, 0, W, H); }

  const wx = W * WX, wy = H * WY, gy = H * 0.86;

  // window light (flickers when the portal opens)
  if (b >= 1) {
    let a = 0.55;
    if (b === 2) a = 0.22 + 0.4 * Math.abs(Math.sin(INTRO.t * 16));
    const g = ctx.createRadialGradient(wx, wy, 10, wx, wy, 230);
    g.addColorStop(0, 'rgba(255,210,120,' + a.toFixed(2) + ')');
    g.addColorStop(1, 'rgba(255,210,120,0)');
    ctx.fillStyle = g;
    ctx.fillRect(wx - 230, wy - 230, 460, 460);
  }

  // portal
  const targetR = b >= 2 ? 64 : 0;
  INTRO.portalR += (targetR - INTRO.portalR) * Math.min(1, dt * 2.5);
  if (INTRO.portalR > 1) {
    ctx.save();
    ctx.translate(wx, wy);
    const cols = ['#b565ff', '#4ecdc4', '#ff5fa2'];
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.strokeStyle = cols[i];
      ctx.lineWidth = 7 - i * 1.5;
      const r = Math.max(INTRO.portalR - i * 13, 4);
      const a0 = INTRO.spin * (1 + i * 0.35) + i * 2.1;
      ctx.arc(0, 0, r, a0, a0 + Math.PI * 1.4);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Rochelle at the window, then sucked in
  if (b >= 1) {
    const f = SHEETS.her.idle[0];
    let rx = wx, ry = gy - 105, s = 0.62, rot = 0;
    if (b >= 3) {
      INTRO.suckT += dt;
      const p = Math.min(1, INTRO.suckT / 1.8);
      const e = p * p;
      ry = (gy - 105) + (wy - (gy - 105)) * e;
      s = 0.62 * (1 - e * 0.93);
      rot = e * 9;
    }
    drawSheetFrame(SHEETS.her.img, f, rx, ry, s, rot);
  }

  // Kyle runs in and dives
  if (b >= 4) {
    INTRO.kyleT += dt;
    const frames = SHEETS.him.walk;
    const f = frames[Math.floor(INTRO.kyleT * 10) % frames.length];
    const runDur = 1.1, diveDur = 0.9;
    let kx, ky, rot = 0, s = 0.62;
    if (INTRO.kyleT < runDur) {
      const p = INTRO.kyleT / runDur;
      kx = (W + 120) + ((wx + 190) - (W + 120)) * p;
      ky = gy - 105;
    } else if (INTRO.kyleT < runDur + diveDur) {
      const p = (INTRO.kyleT - runDur) / diveDur;
      const x0 = wx + 190, y0 = gy - 105;
      kx = x0 + (wx - x0) * p;
      ky = y0 + (wy - y0) * p - Math.sin(p * Math.PI) * 60;
      rot = -p * 1.4;
      s = 0.62 * (1 - p * 0.55);
    } else { kx = wx; ky = wy; s = 0.04; }
    drawSheetFrame(SHEETS.him.img, f, kx, ky, s, rot);
  }

  // white flash into the 90s
  if (b === 5) INTRO.flash = Math.min(1, bt / BEATS[5].dur * 1.25);
  if (INTRO.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,' + INTRO.flash.toFixed(2) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}
introLayer.addEventListener('click', () => { if (mode === 'intro') nextBeat(); });
skipBtn.addEventListener('click', e => { e.stopPropagation(); finishIntro(); });
document.getElementById('introBtn').addEventListener('click', startIntro);

const APPS = [

// TamaGotcha mini-app
const pet = { hunger: 80, happiness: 80 };
const hungerFill = document.getElementById('hungerFill');
const happyFill = document.getElementById('happyFill');
const moodEl = document.getElementById('mood');
function petUI() {
  hungerFill.style.width = pet.hunger + '%';
  happyFill.style.width = pet.happiness + '%';
  const avg = (pet.hunger + pet.happiness) / 2;

}

});
document.getElementById('playBtn').addEventListener('click', () => {

});
setInterval(() => {

  pet.happiness = Math.max(0, pet.happiness - 1);
  if (document.getElementById('pTama').classList.contains('open')) petUI();
}, 2000);
petUI();

// WEEDSWEEPER mini-app
const WN = 8, WCOUNT = 10;
let wWeeds = new Set(), wOpen = new Set(), wFlag = new Set(), wOver = false, wFlagMode = false;
const weedGrid = document.getElementById('weedGrid');
const weedStatus = document.getElementById('weedStatus');
const weedFlagBtn = document.getElementById('weedFlag');
function weedNew() {
  wWeeds = new Set(); wOpen = new Set(); wFlag = new Set(); wOver = false;
  while (wWeeds.size < WCOUNT) wWeeds.add(Math.floor(Math.random() * WN * WN));
  weedStatus.textContent = "find the weeds, don't pick 'em 🌿";
  weedDraw();
}
function weedAdj(i) {
  const r = Math.floor(i / WN), c = i % WN;
  let n = 0;
  for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
    if (!dr && !dc) continue;
    const rr = r + dr, cc = c + dc;
    if (rr >= 0 && rr < WN && cc >= 0 && cc < WN && wWeeds.has(rr * WN + cc)) n++;
  }
  return n;
}
function weedReveal(i) {
  if (wOver || wOpen.has(i) || wFlag.has(i)) return;
  if (wWeeds.has(i)) {
    wOver = true;
    weedStatus.textContent = 'PRANKED!! 🌿😱';
    wWeeds.forEach(w => wOpen.add(w));
    weedDraw();
    return;
  }
  const stack = [i];
  while (stack.length) {
    const j = stack.pop();
    if (wOpen.has(j) || wFlag.has(j) || wWeeds.has(j)) continue;
    wOpen.add(j);
    if (weedAdj(j) === 0) {
      const r = Math.floor(j / WN), c = j % WN;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc;
        if (rr >= 0 && rr < WN && cc >= 0 && cc < WN) stack.push(rr * WN + cc);
      }
    }
  }
  if (wOpen.size === WN * WN - WCOUNT) {
    wOver = true;
    weedStatus.textContent = 'YARD CLEAN! 🏆✨';
  }
  weedDraw();
}
function weedDraw() {
  weedGrid.innerHTML = '';
  for (let i = 0; i < WN * WN; i++) {
    const d = document.createElement('div');
    d.className = 'wcell';
    if (wOpen.has(i)) {
      d.classList.add('open');
      if (wWeeds.has(i)) { d.classList.add('weed'); d.textContent = '🌿'; }
      else { const n = weedAdj(i); d.textContent = n ? n : ''; }
    } else if (wFlag.has(i)) {
      d.textContent = '🚩';
    }
    d.addEventListener('click', () => {
      if (wFlagMode && !wOpen.has(i) && !wOver) {
        if (wFlag.has(i)) wFlag.delete(i); else wFlag.add(i);
        weedDraw();
      } else weedReveal(i);
    });
    d.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (!wOpen.has(i) && !wOver) {
        if (wFlag.has(i)) wFlag.delete(i); else wFlag.add(i);
        weedDraw();
      }
    });
    let lpTimer = null;
    d.addEventListener('touchstart', () => {
      lpTimer = setTimeout(() => {
        lpTimer = 'fired';
        if (!wOpen.has(i) && !wOver) {
          if (wFlag.has(i)) wFlag.delete(i); else wFlag.add(i);
          weedDraw();
        }
      }, 450);
    }, {passive: true});
    d.addEventListener('touchend', e => {
      if (lpTimer === 'fired') { e.preventDefault(); lpTimer = null; }
      else clearTimeout(lpTimer);
    });
    weedGrid.appendChild(d);
  }
}
document.getElementById('weedNew').addEventListener('click', weedNew);
weedFlagBtn.addEventListener('click', () => {
  wFlagMode = !wFlagMode;
  weedFlagBtn.textContent = '🚩 Flag: ' + (wFlagMode ? 'on' : 'off');
  weedFlagBtn.classList.toggle('active', wFlagMode);
});
weedNew();

// main loop
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;

  if (mode === 'intro') { drawIntro(dt); requestAnimationFrame(frame); return; }

  const left = keys['ArrowLeft'] || keys['a'] || keys['A'] || touchLeft || (mouseDown && mouseDir === 'left');
  const right = keys['ArrowRight'] || keys['d'] || keys['D'] || touchRight || (mouseDown && mouseDir === 'right');
  player.moving = left !== right;
  if (player.moving) {
    player.dir = right ? 1 : -1;
    player.x += player.dir * SPEED * dt;
    player.animT += dt;
  } else {
    player.animT += dt * 0.4;
  }

  const w = worldW();
  player.x = Math.max(60, Math.min(w - 60, player.x));
  let camX = Math.max(0, Math.min(w - W, player.x - W / 2));

  const img = SCENE_IMG[scene];
  ctx.fillStyle = SCENE_BG[scene];
  ctx.fillRect(0, 0, W, H);
  if (img.naturalWidth) ctx.drawImage(img, -camX, 0, w, H);

  // door prompt
  if (scene === 'street') {
    const d = doorAt();
    if (d === 'arcade') { doorPrompt.textContent = '▲ enter the arcade'; doorPrompt.classList.add('show'); }
    else if (d === 'mall') { doorPrompt.textContent = '▲ enter the mall'; doorPrompt.classList.add('show'); }
    else doorPrompt.classList.remove('show');
  } else {
    doorPrompt.textContent = '▼ back to the street';
    doorPrompt.classList.add('show');
  }

  // player
  const S = SHEETS[char];
  const set = player.moving ? S.walk : S.idle;
  const fps = player.moving ? 10 : 3;
  const f = set[Math.floor(player.animT * fps) % set.length];
  const dh = player.heightPx, dw = dh * (f.w / f.h);
  const groundY = H * 0.84;
  const dx = player.x - camX - dw / 2, dy = groundY - dh;
  ctx.save();
  if (player.dir < 0) {
    ctx.translate(dx + dw / 2, 0); ctx.scale(-1, 1); ctx.translate(-(dx + dw / 2), 0);
  }
  if (S.img.naturalWidth) ctx.drawImage(S.img, f.x, f.y, f.w, f.h, dx, dy, dw, dh);
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.ellipse(player.x - camX, groundY + 6, dw * 0.32, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  requestAnimationFrame(frame);
}
let seenIntro = false;
try { seenIntro = !!localStorage.getItem('heysup_intro'); } catch (e) {}
if (!seenIntro) startIntro();
requestAnimationFrame(frame);
